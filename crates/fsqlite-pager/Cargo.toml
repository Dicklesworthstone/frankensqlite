[package]
name = "fsqlite-pager"
version = "0.3.8"
description = "Page cache and journal management"
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
default = ["native"]
native = [
    "encryption",
    "fsqlite-types/native",
    "fsqlite-vfs/native",
    "fsqlite-wal/native",
]
wasm = ["fsqlite-types/wasm", "fsqlite-vfs/wasm", "fsqlite-wal/wasm"]
linux-asupersync-uring = ["fsqlite-vfs/linux-asupersync-uring"]
fault-injection = ["fsqlite-wal/fault-injection"]
encryption = ["dep:argon2", "dep:chacha20poly1305"]
# Bayesian-mixture e-value eviction scoring (IMPL-19 / AAC-P5).
# When enabled, ShardedPageCache records accesses into an EValueEvictor and
# prefers the lowest-e page for eviction. Falls back to the existing policy
# when disabled (compile-out).
evalue-eviction = []
# Hidden adapters used only by standalone Criterion targets.
bench-internals = []

[dependencies]
foldhash = "0.2.0"
smallvec = { version = "1.15.2", features = ["const_generics", "union", "const_new"] }
bumpalo = { version = "3", features = ["collections"] }
fsqlite-types = { workspace = true, default-features = false }
fsqlite-error = { workspace = true }
fsqlite-observability = { workspace = true }
fsqlite-vfs = { workspace = true, default-features = false }
fsqlite-wal = { workspace = true, default-features = false }
xxhash-rust = { workspace = true }
chacha20poly1305 = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
hashbrown.workspace = true
dashmap.workspace = true
tracing.workspace = true
blake3 = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
asupersync.workspace = true
parking_lot = { workspace = true }
# bd-85x9y / GH#364: OS randomness for the creation-stable db-file identity
# stamped into a brand-new database header. Native only — wasm has no durable
# file-backed databases and uses a process-unique counter fallback instead.
rand = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The final browser package owns canonical asupersync profile selection.
asupersync.workspace = true

[dev-dependencies]
# The storage stack is `async`, so inline tests must drive a runtime via
# `asupersync::test_utils::run_test`, which lives behind `test-internals`.
asupersync = { workspace = true, features = ["test-internals"] }
proptest = { workspace = true }
tempfile = { workspace = true }
# Dev-only, and fsqlite-mvcc depends on fsqlite-pager. Keep this local path
# versionless so Cargo strips the dev edge when packaging and avoids a publish
# cycle while pager tests still use the workspace MVCC source.
fsqlite-mvcc = { path = "../fsqlite-mvcc", default-features = false }
fsqlite-wal = { workspace = true, default-features = false }
serde_json = { workspace = true }
criterion = { workspace = true }
sha2 = { workspace = true }
tracing-subscriber = { workspace = true }

[[bench]]
name = "page_cache_saturated_reclaim"
harness = false
required-features = ["bench-internals"]

[lints]
workspace = true

name: Workspace Lint Gate

# bd-h9o9r: the README's universal verification gates require
# `cargo clippy --workspace --all-targets -- -D warnings` and
# `cargo fmt --check`, but no Linux workflow ever ran them — the only clippy
# in CI was the single-crate Windows VFS job. Lint redness therefore
# accumulated invisibly (fsqlite-pager landed 135 errors with the July 24
# async migration and stayed green everywhere warm caches skipped the
# crate). This workflow makes the gate real: cold cache per run for the
# lint job itself is acceptable because clippy shares the build cache
# restored below, and -D warnings means any regression fails the PR.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/e2e-tests-not-run-in-ci.txt"
      - "scripts/ci_e2e_test_discovery_gate.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "tests/**"
      - "benches/**"

jobs:
  # bd-ohk1x: an fsqlite-e2e integration test that no workflow names will
  # COMPILE in CI and never EXECUTE, so it gates nothing while reading as
  # coverage. This catches that drift. It is intentionally a static check with
  # no toolchain and no build, so it runs in seconds and cannot be skipped for
  # being slow.
  e2e-test-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Every fsqlite-e2e test is either run by CI or explicitly baselined
        shell: bash
        run: scripts/ci_e2e_test_discovery_gate.sh

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: clippy

      - name: Restore build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-lint

      - name: Clippy (workspace, all targets, deny warnings)
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets -- -D warnings

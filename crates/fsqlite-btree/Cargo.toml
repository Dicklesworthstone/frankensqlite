[package]
name = "fsqlite-btree"
version = "0.3.2"
description = "B-tree storage engine"
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
default = ["native"]
native = ["fsqlite-pager/native"]
wasm = ["fsqlite-pager/wasm"]
bench-internals = []

[dependencies]
fsqlite-types = { path = "../fsqlite-types", version = "0.3.0", default-features = false }
fsqlite-error = { workspace = true }
fsqlite-func = { workspace = true }
fsqlite-pager = { version = "0.3.0", path = "../fsqlite-pager", default-features = false }
tracing = { workspace = true }
hashbrown = { workspace = true }
serde = { workspace = true }
foldhash = "0.2.0"
smallvec = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
asupersync = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "cell_parse_hot_paths"
harness = false

[lints]
workspace = true

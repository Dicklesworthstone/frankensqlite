[package]
name = "fsqlite-ext-json"
version = "0.3.7"
description = "JSON1 functions and virtual tables"
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
fsqlite-types = { workspace = true }
fsqlite-error = { workspace = true }
fsqlite-func = { workspace = true }
# JSON1 parity requires object keys to round-trip in insertion order, matching
# stock SQLite's json functions — hence a crate-local `preserve_order` instead
# of the workspace spec (see fsqlite#356).
serde_json = { version = "1.0", features = ["preserve_order"] }
json5 = "1.3"

[features]
# `arbitrary_precision` is a VIRAL serde_json feature: Cargo unifies it across the
# whole build, switching serde_json's Number backing to a text-map and breaking
# every downstream f64 deserialization of internally-tagged/untagged/flatten enums
# (bd-uxmhz / GH#375). It is therefore OFF by default. Opt in only when you need
# JSON number literals beyond f64 range preserved (`9e999` -> `9.0e+999`, GH#212);
# with the feature off, non-finite JSON numbers are rejected on parse and a
# constructed +-Inf renders as JSON null (like NaN).
arbitrary_precision = ["serde_json/arbitrary_precision"]

[lints]
workspace = true

name: Release

# DSR IS THE SOLE RELEASE PATH FOR THIS PROJECT.
#
# GitHub Actions must never publish FrankenSQLite to crates.io. The `push`
# trigger on `v*` tags that used to start this workflow has been removed
# deliberately: tagging a release must not cause a publish. The `publish-crates`
# job below is additionally disabled fail-closed by a `false &&` sentinel in its
# `if:` expression, so the publish path cannot run even if a trigger is
# reintroduced by accident.
#
# The job body is retained, not deleted, so the publish sequence and its
# version-consistency checks stay reviewable and so DSR has a reference for the
# topological crate order. Do not re-enable either guard without an explicit
# decision to move releases off DSR.
#
# `workflow_dispatch` is kept solely so `revoke-compromised-token` remains
# reachable during a credential incident. That job does not publish.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Unused: publishing is DSR-only and disabled here"
        required: false
        type: string
      revoke_compromised_token:
        description: "Revoke the configured crates.io token without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish-crates:
    name: Publish fsqlite crates to crates.io
    # FAIL-CLOSED: the leading `false &&` disables this job unconditionally.
    # Publishing is DSR-only. The original guard is preserved verbatim after the
    # sentinel so the intended conditions stay on the record; removing only the
    # `false &&` would restore the previous behavior, which requires an explicit
    # decision to move releases off DSR.
    if: ${{ false && ((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && github.event.inputs.revoke_compromised_token != 'true' && !contains(github.event.inputs.tag || github.ref_name, '-') && github.repository_owner == 'Dicklesworthstone') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Resolve publish sequence and validate versions
        id: publish_plan
        shell: bash
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # Every publishable workspace crate, in topological
          # (normal-dependency) order. Keep the user-facing CLI, C API, and
          # WASM packages in the release set too; otherwise a tag can report
          # success while those public packages remain on an older version.
          crates=(
            fsqlite-error
            fsqlite-types
            fsqlite-observability
            fsqlite-ast
            fsqlite-func
            fsqlite-vfs
            fsqlite-parser
            fsqlite-planner
            fsqlite-wal
            fsqlite-pager
            fsqlite-btree
            fsqlite-mvcc
            fsqlite-vdbe
            fsqlite-ext-fts3
            fsqlite-ext-fts5
            fsqlite-ext-json
            fsqlite-ext-rtree
            fsqlite-ext-session
            fsqlite-ext-icu
            fsqlite-ext-misc
            fsqlite-core
            fsqlite
            fsqlite-cli
            fsqlite-c-api
            fsqlite-wasm
          )

          version="${TAG_NAME#v}"
          if [[ "${version}" == "${TAG_NAME}" ]]; then
            echo "Tag '${TAG_NAME}' must use the v<semver> format." >&2
            exit 1
          fi

          cargo metadata --no-deps --format-version 1 > /tmp/cargo-metadata.json

          mapfile -t publishable_crates < <(
            jq -r '
              .packages[]
              | select(.publish == null or (.publish | length) > 0)
              | .name
            ' /tmp/cargo-metadata.json | sort
          )
          mapfile -t configured_crates < <(printf '%s\n' "${crates[@]}" | sort)
          if ! diff -u \
            <(printf '%s\n' "${publishable_crates[@]}") \
            <(printf '%s\n' "${configured_crates[@]}"); then
            echo "Publish sequence must contain every publishable workspace crate exactly once." >&2
            exit 1
          fi

          for crate in "${crates[@]}"; do
            crate_version="$(jq -r --arg crate "${crate}" '.packages[] | select(.name == $crate) | .version' /tmp/cargo-metadata.json)"
            if [[ -z "${crate_version}" || "${crate_version}" == "null" ]]; then
              echo "Crate '${crate}' not found in workspace metadata." >&2
              exit 1
            fi
            if [[ "${crate_version}" != "${version}" ]]; then
              echo "Version mismatch for '${crate}': crate=${crate_version}, tag=${version}" >&2
              exit 1
            fi
            echo "Publish plan includes ${crate} ${crate_version}"
          done

          echo "sequence=${crates[*]}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Publish crates in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ steps.publish_plan.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is required for crates.io publish." >&2
            exit 1
          fi

          already_published() {
            grep -qiE 'already (uploaded|exists)|is already uploaded'
          }

          for crate in ${{ steps.publish_plan.outputs.sequence }}; do
            for attempt in 1 2 3 4 5; do
              set +e
              dry_run_output="$(cargo publish -p "${crate}" --locked --dry-run 2>&1)"
              dry_run_status=$?
              set -e
              echo "${dry_run_output}"
              if [[ "${dry_run_status}" -eq 0 ]] || already_published <<< "${dry_run_output}"; then
                break
              fi
              if [[ "${attempt}" -eq 5 ]]; then
                echo "Dry-run publish checks failed for ${crate} after ${attempt} attempts." >&2
                exit 1
              fi
              sleep 20
            done

            echo "Publishing ${crate} (${RELEASE_VERSION})"
            set +e
            # Cargo reads CARGO_REGISTRY_TOKEN directly. Never pass the token
            # on argv, where local process inspection can expose it.
            publish_output="$(cargo publish -p "${crate}" --locked 2>&1)"
            publish_status=$?
            set -e
            echo "${publish_output}"
            if [[ "${publish_status}" -ne 0 ]]; then
              if already_published <<< "${publish_output}"; then
                echo "${crate} is already published; continuing."
              else
                exit "${publish_status}"
              fi
            fi
            sleep 30
          done

  revoke-compromised-token:
    name: Revoke configured crates.io token
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.revoke_compromised_token == 'true' && github.repository_owner == 'Dicklesworthstone'
    runs-on: [self-hosted, linux, x64, hfdt-fsqlite-release]
    timeout-minutes: 5
    steps:
      - name: Revoke token and prove it no longer authenticates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          set +x

          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is required for revocation." >&2
            exit 1
          fi

          revoke_code="$(
            printf \
              'header = "Authorization: %s"\nuser-agent = "frankensqlite-release-security-remediation/1.0 (+https://github.com/Dicklesworthstone/frankensqlite)"\n' \
              "${CARGO_REGISTRY_TOKEN}" |
              curl \
                --config - \
                --proto '=https' \
                --tlsv1.2 \
                --silent \
                --show-error \
                --output "${RUNNER_TEMP}/crates-token-revoke.json" \
                --write-out '%{http_code}' \
                --request DELETE \
                https://crates.io/api/v1/tokens/current
          )"
          if [[ "${revoke_code}" != "204" ]]; then
            echo "crates.io token revocation failed with HTTP ${revoke_code}." >&2
            error_detail="$(
              sed -n 's/.*"detail":"\([^"]*\)".*/\1/p' \
                "${RUNNER_TEMP}/crates-token-revoke.json" |
                head -n 1
            )"
            echo "crates.io detail: ${error_detail:-unavailable}" >&2
            exit 1
          fi

          verify_code="$(
            printf \
              'header = "Authorization: %s"\nuser-agent = "frankensqlite-release-security-remediation/1.0 (+https://github.com/Dicklesworthstone/frankensqlite)"\n' \
              "${CARGO_REGISTRY_TOKEN}" |
              curl \
                --config - \
                --proto '=https' \
                --tlsv1.2 \
                --silent \
                --show-error \
                --output "${RUNNER_TEMP}/crates-token-revoke-verify.json" \
                --write-out '%{http_code}' \
                --request DELETE \
                https://crates.io/api/v1/tokens/current
          )"
          if [[ "${verify_code}" != "403" ]]; then
            echo "Revoked crates.io token unexpectedly authenticated (HTTP ${verify_code})." >&2
            exit 1
          fi

          echo "Configured crates.io token revoked; repeat authentication returned HTTP 403."

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v0.1.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-crates:
    name: Publish fsqlite crates to crates.io
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && !contains(github.event.inputs.tag || github.ref_name, '-') && github.repository_owner == 'Dicklesworthstone'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Resolve publish sequence and validate versions
        id: publish_plan
        shell: bash
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          crates=(
            fsqlite-error
            fsqlite-types
            fsqlite-ext-json
            fsqlite-ext-fts5
            fsqlite-core
            fsqlite
          )

          version="${TAG_NAME#v}"
          if [[ "${version}" == "${TAG_NAME}" ]]; then
            echo "Tag '${TAG_NAME}' must use the v<semver> format." >&2
            exit 1
          fi

          cargo metadata --no-deps --format-version 1 > /tmp/cargo-metadata.json
          for crate in "${crates[@]}"; do
            crate_version="$(jq -r --arg crate "${crate}" '.packages[] | select(.name == $crate) | .version' /tmp/cargo-metadata.json)"
            if [[ -z "${crate_version}" || "${crate_version}" == "null" ]]; then
              echo "Crate '${crate}' not found in workspace metadata." >&2
              exit 1
            fi
            if [[ "${crate_version}" != "${version}" ]]; then
              echo "Version mismatch for '${crate}': crate=${crate_version}, tag=${version}" >&2
              exit 1
            fi
            echo "Publish plan includes ${crate} ${crate_version}"
          done

          echo "sequence=${crates[*]}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Publish crates in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ steps.publish_plan.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is required for crates.io publish." >&2
            exit 1
          fi

          already_published() {
            grep -qiE 'already (uploaded|exists)|is already uploaded'
          }

          for crate in ${{ steps.publish_plan.outputs.sequence }}; do
            for attempt in 1 2 3 4 5; do
              set +e
              dry_run_output="$(cargo publish -p "${crate}" --locked --dry-run 2>&1)"
              dry_run_status=$?
              set -e
              echo "${dry_run_output}"
              if [[ "${dry_run_status}" -eq 0 ]] || already_published <<< "${dry_run_output}"; then
                break
              fi
              if [[ "${attempt}" -eq 5 ]]; then
                echo "Dry-run publish checks failed for ${crate} after ${attempt} attempts." >&2
                exit 1
              fi
              sleep 20
            done

            echo "Publishing ${crate} (${RELEASE_VERSION})"
            set +e
            publish_output="$(cargo publish -p "${crate}" --locked --token "${CARGO_REGISTRY_TOKEN}" 2>&1)"
            publish_status=$?
            set -e
            echo "${publish_output}"
            if [[ "${publish_status}" -ne 0 ]]; then
              if already_published <<< "${publish_output}"; then
                echo "${crate} is already published; continuing."
              else
                exit "${publish_status}"
              fi
            fi
            sleep 30
          done

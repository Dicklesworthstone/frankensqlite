name: Windows VFS Interop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "crates/fsqlite/**"
      - "crates/fsqlite-core/**"
      - "crates/fsqlite-pager/**"
      - "crates/fsqlite-vfs/**"
      - ".github/workflows/windows-vfs-interop.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "crates/fsqlite/**"
      - "crates/fsqlite-core/**"
      - "crates/fsqlite-pager/**"
      - "crates/fsqlite-vfs/**"
      - ".github/workflows/windows-vfs-interop.yml"

jobs:
  windows-vfs-interop:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
    steps:
      - name: Enable git long paths (Windows MAX_PATH workaround)
        shell: pwsh
        run: |
          git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Ensure sqlite3 CLI is available
        shell: pwsh
        run: |
          if (-not (Get-Command sqlite3 -ErrorAction SilentlyContinue)) {
            choco install sqlite --yes --no-progress
            $env:Path += ";C:\ProgramData\chocolatey\bin"
          }
          $sqlite = Get-Command sqlite3 -ErrorAction SilentlyContinue
          if (-not $sqlite) {
            throw "sqlite3 CLI is required for test_e2e_windowsvfs_c_sqlite_interop"
          }
          sqlite3 --version

      - name: Create artifacts directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path artifacts -Force | Out-Null

      - name: Check fsqlite-vfs
        shell: pwsh
        run: |
          $checkOutput = & cargo check --locked -p fsqlite-vfs --all-targets 2>&1
          $checkExitCode = $LASTEXITCODE
          $checkOutput | Tee-Object -FilePath artifacts/cargo-check-fsqlite-vfs.txt
          if ($checkExitCode -ne 0) {
            throw "fsqlite-vfs cargo check failed with exit code $checkExitCode"
          }

      - name: Clippy fsqlite-vfs
        shell: pwsh
        run: |
          $clippyOutput = & cargo clippy --locked -p fsqlite-vfs --all-targets -- -D warnings 2>&1
          $clippyExitCode = $LASTEXITCODE
          $clippyOutput | Tee-Object -FilePath artifacts/cargo-clippy-fsqlite-vfs.txt
          if ($clippyExitCode -ne 0) {
            throw "fsqlite-vfs clippy failed with exit code $clippyExitCode"
          }

      - name: Run full fsqlite-vfs tests
        shell: pwsh
        run: |
          $testOutput = & cargo test --locked -p fsqlite-vfs -- --nocapture 2>&1
          $testExitCode = $LASTEXITCODE
          $testOutput | Tee-Object -FilePath artifacts/cargo-test-fsqlite-vfs.txt
          if ($testExitCode -ne 0) {
            throw "fsqlite-vfs tests failed with exit code $testExitCode"
          }

      - name: Prove descriptor-bound facade opens exactly on Windows
        shell: pwsh
        run: |
          $tests = @(
            "tests::reserved_identity_open_never_synthesizes_a_missing_path",
            "tests::reserved_identity_open_refuses_a_preexisting_recovery_artifact_without_mutation",
            "tests::reserved_identity_open_refuses_a_nonempty_file_without_artifact_mutation",
            "tests::windows_expected_identity_refuses_before_any_database_artifact_mutation",
            "tests::windows_schema_only_identity_mismatch_precedes_artifact_mutation",
            "tests::windows_existing_expected_identity_accepts_matching_file",
            "tests::windows_schema_only_expected_identity_accepts_matching_file",
            "tests::windows_reserved_empty_open_is_identity_bound"
          )
          $logPath = "artifacts/cargo-test-descriptor-identity.txt"
          foreach ($test in $tests) {
            "=== $test ===" | Tee-Object -FilePath $logPath -Append
            $testOutput = & cargo test --locked -p fsqlite --features native $test -- --exact --nocapture 2>&1
            $testExitCode = $LASTEXITCODE
            $testOutput | Tee-Object -FilePath $logPath -Append
            if ($testExitCode -ne 0) {
              throw "descriptor-bound facade proof failed: $test"
            }
            $testOutputText = $testOutput -join "`n"
            $oneTestRuns = ([regex]::Matches($testOutputText, "(?m)^running 1 test$")).Count
            $oneTestPassed = $testOutputText -match "(?m)^test result: ok\. 1 passed; 0 failed; 0 ignored;"
            if ($oneTestRuns -ne 1 -or -not $oneTestPassed) {
              throw "expected exactly one executed and passing test for ${test}; observed running-count=${oneTestRuns}"
            }
          }

      - name: Run Windows interop E2E test
        shell: pwsh
        run: |
          $interopOutput = & cargo test --locked -p fsqlite-vfs test_e2e_windowsvfs_c_sqlite_interop -- --nocapture 2>&1
          $interopExitCode = $LASTEXITCODE
          $interopOutput | Tee-Object -FilePath artifacts/cargo-test-windows-interop.txt
          if ($interopExitCode -ne 0) {
            throw "Windows VFS interop test failed with exit code $interopExitCode"
          }

      - name: Upload Windows VFS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-vfs-interop-logs
          path: artifacts/

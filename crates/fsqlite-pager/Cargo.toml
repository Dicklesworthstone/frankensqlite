[package]
name = "fsqlite-pager"
version = "0.1.19"
description = "Page cache and journal management"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["native"]
native = [
    "encryption",
    "fsqlite-types/native",
    "fsqlite-vfs/native",
    "fsqlite-wal/native",
]
wasm = ["fsqlite-types/wasm", "fsqlite-vfs/wasm", "fsqlite-wal/wasm"]
linux-asupersync-uring = ["fsqlite-vfs/linux-asupersync-uring"]
fault-injection = ["fsqlite-wal/fault-injection"]
encryption = ["dep:argon2", "dep:chacha20poly1305"]
# Bayesian-mixture e-value eviction scoring (IMPL-19 / AAC-P5).
# When enabled, ShardedPageCache records accesses into an EValueEvictor and
# prefers the lowest-e page for eviction. Falls back to the existing policy
# when disabled (compile-out).
evalue-eviction = []

[dependencies]
foldhash = "0.2.0"
smallvec = { version = "1.15.2", features = ["const_generics", "union", "const_new"] }
bumpalo = { version = "3", features = ["collections"] }
crossbeam-queue = { workspace = true }
fsqlite-types = { path = "../fsqlite-types", version = "0.1.19", default-features = false }
fsqlite-error = { path = "../fsqlite-error", version = "0.1.19" }
fsqlite-observability = { workspace = true }
fsqlite-vfs = { path = "../fsqlite-vfs", version = "0.1.19", default-features = false }
fsqlite-wal = { path = "../fsqlite-wal", version = "0.1.19", default-features = false }
xxhash-rust = { workspace = true }
chacha20poly1305 = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
hashbrown.workspace = true
dashmap.workspace = true
tracing.workspace = true
blake3 = { workspace = true }
asupersync.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parking_lot = { workspace = true }

[dev-dependencies]
# The storage stack is `async`, so inline tests must drive a runtime via
# `asupersync::test_utils::run_test`, which lives behind `test-internals`.
asupersync = { workspace = true, features = ["test-internals"] }
proptest = { workspace = true }
tempfile = { workspace = true }
# Dev-only, and fsqlite-mvcc depends on fsqlite-pager — so pager must publish
# FIRST. A `^0.1.19` pin cannot resolve at publish time (mvcc 0.1.19 is not on
# crates.io yet). Keep this a permissive range so the dev-edge stays satisfiable.
fsqlite-mvcc = { path = "../fsqlite-mvcc", version = ">=0.1.2, <0.2.0" }
fsqlite-wal = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

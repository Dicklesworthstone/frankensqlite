[package]
name = "fsqlite-wasm"
version = "0.1.19"
description = "WebAssembly bindings for FrankenSQLite"
edition.workspace = true
license-file.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
api-extras = []
backup = []
batch-execution = []
date-params = []
diagnostics = ["fsqlite-core/diagnostic-pragmas"]
memory-options = []
prepared-statements = []
row-arrays = []
extensions = ["ext-json", "ext-fts5", "ext-icu", "ext-misc", "ext-rtree"]
ext-json = ["fsqlite-core/ext-json"]
ext-fts5 = ["fsqlite-core/ext-fts5"]
ext-icu = ["fsqlite-core/ext-icu"]
ext-misc = ["fsqlite-core/ext-misc"]
ext-rtree = ["fsqlite-core/ext-rtree"]
panic-hook = ["dep:console_error_panic_hook"]
tracing = [
    "dep:tracing-wasm",
    "dep:tracing",
    "fsqlite-core/wasm-tracing-max-level-warn",
    "tracing/release_max_level_warn",
]

[dependencies]
console_error_panic_hook = { version = "0.1", optional = true }
fsqlite-types = { workspace = true }
fsqlite-error = { workspace = true }
fsqlite-vfs = { version = "0.1.19", path = "../fsqlite-vfs", default-features = false, features = ["wasm"] }
fsqlite-ast = { workspace = true }
fsqlite-parser = { workspace = true }
fsqlite-planner = { version = "0.1.19", path = "../fsqlite-planner", default-features = false, features = ["wasm"] }
fsqlite-func = { workspace = true }
fsqlite-pager = { version = "0.1.19", path = "../fsqlite-pager", default-features = false, features = ["wasm"] }
js-sys = "0.3.102"
wasm-bindgen = "0.2.125"
# Required by `wasm_bindgen`'s codegen for `async fn` exports (they lower to
# JS Promises through `wasm_bindgen_futures::future_to_promise`).
wasm-bindgen-futures = "0.4"

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "linux"))'.dependencies]
fsqlite-core = { version = "0.1.19", path = "../fsqlite-core", default-features = false, features = ["linux-asupersync-uring"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "linux")))'.dependencies]
fsqlite-core = { version = "0.1.19", path = "../fsqlite-core", default-features = false, features = ["native"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
fsqlite-core = { version = "0.1.19", path = "../fsqlite-core", default-features = false, features = ["wasm"] }
tracing = { workspace = true, optional = true, features = ["release_max_level_error"] }
tracing-wasm = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
wasm-bindgen-test = "0.3.75"

# The host-target inline test module (`#[cfg(all(test, not(target_arch =
# "wasm32")))]`) drives the async core API, so it needs a runtime via
# `asupersync::test_utils::run_test`, which lives behind `test-internals`.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
asupersync = { workspace = true, features = ["test-internals"] }

[lints]
workspace = true

[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/fsqlite-types",
    "crates/fsqlite-error",
    "crates/fsqlite-vfs",
    "crates/fsqlite-pager",
    "crates/fsqlite-wal",
    "crates/fsqlite-mvcc",
    "crates/fsqlite-btree",
    "crates/fsqlite-ast",
    "crates/fsqlite-parser",
    "crates/fsqlite-planner",
    "crates/fsqlite-vdbe",
    "crates/fsqlite-func",
    "crates/fsqlite-ext-fts3",
    "crates/fsqlite-ext-fts5",
    "crates/fsqlite-ext-rtree",
    "crates/fsqlite-ext-json",
    "crates/fsqlite-ext-session",
    "crates/fsqlite-ext-icu",
    "crates/fsqlite-ext-misc",
    "crates/fsqlite-core",
    "crates/fsqlite-e2e",
    "crates/fsqlite",
    "crates/fsqlite-cli",
    "crates/fsqlite-harness",
    "crates/fsqlite-observability",
    "crates/fsqlite-c-api",
    "crates/fsqlite-wasm",
    "crates/beads-doctor",
]

[workspace.package]
edition = "2024"
# "MIT License (with OpenAI/Anthropic Rider)" (see ./LICENSE) — a restrictive custom
# license (no rights to OpenAI/Anthropic or ML training/eval use), NOT permissive MIT.
# This is not an SPDX license expression. `license-file` keeps Cargo metadata honest
# and guarantees every published crate contains the complete rider text.
license-file = "LICENSE"
repository = "https://github.com/Dicklesworthstone/frankensqlite"
readme = "README.md"
keywords = ["sqlite", "database", "embedded", "sql", "pure-rust"]
categories = ["database-implementations", "parser-implementations"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cast_lossless = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
doc_markdown = { level = "allow", priority = 1 }
missing_const_for_fn = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
option_if_let_else = { level = "allow", priority = 1 }
significant_drop_tightening = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
unreadable_literal = { level = "allow", priority = 1 }
uninlined_format_args = { level = "allow", priority = 1 }
# Test-heavy patterns: these pedantic/nursery lints fire pervasively in the
# 200+ harness test files and add noise without catching real bugs.
assertions_on_constants = { level = "allow", priority = 1 }
bool_to_int_with_if = { level = "allow", priority = 1 }
case_sensitive_file_extension_comparisons = { level = "allow", priority = 1 }
collection_is_never_read = { level = "allow", priority = 1 }
doc_lazy_continuation = { level = "allow", priority = 1 }
explicit_iter_loop = { level = "allow", priority = 1 }
float_cmp = { level = "allow", priority = 1 }
format_push_string = { level = "allow", priority = 1 }
# `Connection` is intentionally single-threaded (`Rc`/`RefCell`), and its
# composed operation futures deliberately keep state inline. Requiring every
# integration harness to box those futures would add heap allocations merely
# to satisfy Clippy's size heuristic, without changing the shipped layout or
# sendability contract. Cargo lint inheritance cannot scope this exception to
# integration-test targets, so the workspace release gates retain performance
# and stack-safety validation instead.
future_not_send = { level = "allow", priority = 1 }
if_then_some_else_none = { level = "allow", priority = 1 }
large_futures = { level = "allow", priority = 1 } # See the Connection rationale above.
let_and_return = { level = "allow", priority = 1 }
many_single_char_names = { level = "allow", priority = 1 }
manual_range_contains = { level = "allow", priority = 1 }
needless_collect = { level = "allow", priority = 1 }
needless_pass_by_value = { level = "allow", priority = 1 }
no_effect_underscore_binding = { level = "allow", priority = 1 }
redundant_clone = { level = "allow", priority = 1 }
redundant_closure_for_method_calls = { level = "allow", priority = 1 }
return_self_not_must_use = { level = "allow", priority = 1 }
single_char_pattern = { level = "allow", priority = 1 }
semicolon_if_nothing_returned = { level = "allow", priority = 1 }
single_match = { level = "allow", priority = 1 }
stable_sort_primitive = { level = "allow", priority = 1 }
used_underscore_binding = { level = "allow", priority = 1 }
useless_format = { level = "allow", priority = 1 }
useless_vec = { level = "allow", priority = 1 }
wildcard_enum_match_arm = { level = "allow", priority = 1 }
# Additional pedantic lints that generate noise in test code
approx_constant = { level = "allow", priority = 1 }
cloned_ref_to_slice_refs = { level = "allow", priority = 1 }
default_trait_access = { level = "allow", priority = 1 }
expect_fun_call = { level = "allow", priority = 1 }
format_collect = { level = "allow", priority = 1 }
if_not_else = { level = "allow", priority = 1 }
items_after_statements = { level = "allow", priority = 1 }
manual_assert = { level = "allow", priority = 1 }
manual_checked_ops = { level = "allow", priority = 1 }
manual_let_else = { level = "allow", priority = 1 }
manual_string_new = { level = "allow", priority = 1 }
map_unwrap_or = { level = "allow", priority = 1 }
match_wildcard_for_single_variants = { level = "allow", priority = 1 }
single_match_else = { level = "allow", priority = 1 }
unnecessary_cast = { level = "allow", priority = 1 }
unnecessary_literal_bound = { level = "allow", priority = 1 }

[workspace.dependencies]
# Internal crates
fsqlite-types = { version = "0.3.7", path = "crates/fsqlite-types", default-features = false }
fsqlite-error = { version = "0.3.7", path = "crates/fsqlite-error" }
fsqlite-vfs = { version = "0.3.7", path = "crates/fsqlite-vfs", default-features = false }
fsqlite-pager = { version = "0.3.7", path = "crates/fsqlite-pager", default-features = false }
fsqlite-wal = { version = "0.3.7", path = "crates/fsqlite-wal", default-features = false }
fsqlite-mvcc = { version = "0.3.7", path = "crates/fsqlite-mvcc", default-features = false }
fsqlite-btree = { version = "0.3.7", path = "crates/fsqlite-btree", default-features = false }
fsqlite-ast = { version = "0.3.7", path = "crates/fsqlite-ast" }
fsqlite-parser = { version = "0.3.7", path = "crates/fsqlite-parser" }
fsqlite-planner = { version = "0.3.7", path = "crates/fsqlite-planner", default-features = false }
fsqlite-vdbe = { version = "0.3.7", path = "crates/fsqlite-vdbe", default-features = false }
fsqlite-func = { version = "0.3.7", path = "crates/fsqlite-func" }
fsqlite-ext-fts3 = { version = "0.3.7", path = "crates/fsqlite-ext-fts3" }
fsqlite-ext-fts5 = { version = "0.3.7", path = "crates/fsqlite-ext-fts5" }
fsqlite-ext-rtree = { version = "0.3.7", path = "crates/fsqlite-ext-rtree" }
fsqlite-ext-json = { version = "0.3.7", path = "crates/fsqlite-ext-json" }
fsqlite-ext-session = { version = "0.3.7", path = "crates/fsqlite-ext-session" }
fsqlite-ext-icu = { version = "0.3.7", path = "crates/fsqlite-ext-icu" }
fsqlite-ext-misc = { version = "0.3.7", path = "crates/fsqlite-ext-misc" }
fsqlite-core = { version = "0.3.7", path = "crates/fsqlite-core", default-features = false }
fsqlite = { version = "0.3.7", path = "crates/fsqlite", default-features = false }
fsqlite-cli = { version = "0.3.7", path = "crates/fsqlite-cli" }
fsqlite-harness = { version = "0.3.7", path = "crates/fsqlite-harness" }
fsqlite-e2e = { version = "0.3.7", path = "crates/fsqlite-e2e" }
fsqlite-observability = { version = "0.3.7", path = "crates/fsqlite-observability" }
fsqlite-c-api = { version = "0.3.7", path = "crates/fsqlite-c-api" }
fsqlite-wasm = { version = "0.3.7", path = "crates/fsqlite-wasm" }

# External dependencies
ftui = { version = "0.5.0", default-features = false }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive", "rc"] }
# No `preserve_order` here (fsqlite#356): the workspace-wide feature leaked
# into every downstream consumer via feature unification, silently switching
# serde_json maps to insertion order across their whole build. Crates whose
# semantics genuinely need insertion order (fsqlite-ext-json for SQLite JSON1
# key-order parity) declare their own serde_json spec with the feature.
serde_json = { version = "1.0" }
itoa = "1.0"
tracing = "0.1"
simdutf8 = "0.1"
tracing-subscriber = "0.3.23"
bitflags = { version = "2.13", features = ["serde"] }
smallvec = "1.15"
memchr = "2.8"
parking_lot = "0.12"
web-time = "1.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
crc32c = "0.6"
blake3 = "1.8"
crossbeam-epoch = "0.9"
crossbeam-deque = "0.8"
sha2 = "0.11"
nix = { version = "0.31", default-features = false, features = ["fs", "process", "signal", "socket", "uio", "user"] }
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chacha20poly1305 = "0.11"
argon2 = "0.5"
rand = "0.10"
hashbrown = { version = "0.17", features = ["serde"] }
dashmap = "6.2"
lru = "0.18"
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
# `default-features = false` drops asupersync's proc-macro/runtime extras from
# every fsqlite crate. Keep this registry-resolvable so downstream git consumers
# can build FrankenSQLite without a private `/dp/asupersync` checkout; local
# asupersync development belongs in an uncommitted Cargo patch/config override.
# The explicit `>=0.4.3,<0.5` floor keeps FrankenSQLite in one runtime universe
# with FrankenSearch. 0.4.x re-anchors APIs already shipped in 0.3.10 and pins
# franken-kernel/-decision/-evidence at `^0.4.3`, so the whole family moves in
# lockstep; a caret on 0.3.x would silently fork that family across consumers.
# Remote had pinned 0.4.3 exactly; the compatible range is a strict superset and
# keeps this tree in the same universe as frankensearch's ceiling raise.
asupersync = { version = ">=0.4.3,<0.5", default-features = false }
futures-lite = "2.6.1"

# Dev dependencies
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.11"
insta = { version = "1.48", features = ["json", "yaml"] }
tempfile = "3.27"
toml = "1.1"
syn = { version = "2.0.117", features = ["full", "visit"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.release-perf]
inherits = "release"
opt-level = 3
debug = false
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package.asupersync]
opt-level = 0
debug = false

[package]
name = "fsqlite-mvcc"
version = "0.3.9"
description = "MVCC page-level versioning for concurrent writers"
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
default = ["native"]
native = ["fsqlite-btree/native", "fsqlite-pager/native", "fsqlite-wal/native"]
wasm = ["fsqlite-btree/wasm", "fsqlite-pager/wasm", "fsqlite-wal/wasm"]
linux-asupersync-uring = ["fsqlite-pager/linux-asupersync-uring"]
# Opt-in: route the sharded fallback (pages > FAST_LOCK_ARRAY_SIZE) in
# `InProcessPageLockTable` through a flat-combining publication list per shard
# instead of `parking_lot::Mutex<HashMap>`. Intended for workloads that
# generate high-page-number contention at 8+ concurrent writers. Off by
# default: the fast path (pages 1..=65536) is already lock-free CAS and the
# sharded tail is rarely the bottleneck.
mvcc-flat-combining = []
# Opt-in test support for deterministic, production-shaped commit-combiner
# evidence. Normal MVCC builds retain the uninstrumented hot path.
commit-combiner-test-support = []
# Opt-in test support for deterministic bounded-EBR reclamation receipts.
# Production builds retain the bounded reclamation contract without receipt
# counters on the maintenance path.
ebr-reclaim-test-support = []

[dependencies]
blake3 = { workspace = true }
crc32c = { workspace = true }
crossbeam-epoch = { workspace = true }
fsqlite-types = { workspace = true }
fsqlite-error = { workspace = true }
fsqlite-observability = { workspace = true }
fsqlite-vfs = { workspace = true, default-features = false }
fsqlite-btree = { workspace = true, default-features = false }
fsqlite-pager = { workspace = true, default-features = false }
fsqlite-wal = { workspace = true, default-features = false }
smallvec = { workspace = true }
serde = { workspace = true, features = ["derive"] }
parking_lot = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
xxhash-rust = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
asupersync = { workspace = true }
nix = { workspace = true }

[dev-dependencies]
# Tests use `asupersync::test_utils::run_test`, which lives behind
# `test-internals` (same pattern as fsqlite-vfs/fsqlite/harness/cli). Without
# this, standalone `cargo test -p fsqlite-mvcc` fails to compile even though
# workspace-unified builds pass.
asupersync = { workspace = true, features = ["test-internals"] }
criterion = { workspace = true }
loom = "0.7.2"
proptest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "mvcc_bench"
harness = false

[[bench]]
name = "history_bisect_bench"
harness = false

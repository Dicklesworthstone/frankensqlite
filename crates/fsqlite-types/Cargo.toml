[package]
name = "fsqlite-types"
version = "0.1.19"
description = "Core type definitions for FrankenSQLite"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["native"]
native = ["dep:asupersync"]
wasm = []
# Opt-in nightly `portable_simd` fast path for integer-block classification on
# x86_64. OFF by default so downstream `cargo build` works on stable Rust (the
# `#![feature(portable_simd)]` attribute is gated behind this); enable on a
# nightly toolchain to get the SIMD classifier. The scalar fallback is
# functionally identical, so correctness never depends on this feature.
nightly-simd = []

[dependencies]
bitflags = { workspace = true }
blake3 = { workspace = true }
asupersync = { workspace = true, optional = true }
fsqlite-error = { workspace = true }
smallvec = { workspace = true }
serde = { workspace = true }
memchr = { workspace = true }
simdutf8 = { workspace = true }
tracing = { workspace = true }
xxhash-rust = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parking_lot = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = { workspace = true }

[dev-dependencies]
asupersync = { workspace = true, features = ["test-internals"] }
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
